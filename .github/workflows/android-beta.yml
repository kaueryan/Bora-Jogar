name: Gerar Bora Jogar APK de teste

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  android-debug:
    name: Compilar APK de testes
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verificar Android SDK do runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "Android SDK nao encontrado no runner"; exit 1; }
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Configurar banco compartilhado (somente chaves PUBLICAS)
        env:
          SUPABASE_URL: ${{ vars.BORA_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.BORA_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/configurar-publico.js
      - name: Verificar codigo do aplicativo
        run: npm run verificar
      - name: Gerar projeto Android
        run: npx cap add android
      - name: Sincronizar arquivos web
        run: npx cap sync android
      - name: Construir APK debug
        run: |
          chmod +x android/gradlew
          cd android
          sed -i 's/gradle-8.14.3-all.zip/gradle-8.14.3-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=10000/networkTimeout=180000/' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties
          ./gradlew --no-daemon assembleDebug
      - name: Disponibilizar APK de teste para baixar
        uses: actions/upload-artifact@v4
        with:
          name: Bora-Jogar-Android-APK-Beta
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
